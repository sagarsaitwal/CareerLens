[project]
name = "careerlens-backend"
version = "0.1.0"
description = "CareerLens — deterministic job matching engine with selective AI assistance"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "apscheduler>=3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.119",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The source tree is bind-mounted from the host and the container runs as
# a non-root user, so caches are written outside the mount.
cache_dir = "/tmp/pytest_cache"
markers = [
    # Each hard invariant gets a named test; this marker ties a test back
    # to the documented invariant it protects.
    "invariant: verifies a documented hard invariant",
    "integration: requires a real PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The local `alembic/` migrations directory makes ruff infer that
# `alembic` is first-party. It is not: it is the third-party package,
# and that directory is a script location, not an importable package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true

# APScheduler ships no type information, so strict mode cannot resolve
# it. Scoped to this one package rather than disabled globally.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
