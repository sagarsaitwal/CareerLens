name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # A real PostgreSQL. Constraint behaviour is part of the
      # specification, so SQLite is never substituted.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerlens
          POSTGRES_PASSWORD: ci-not-a-real-secret
          POSTGRES_DB: careerlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://careerlens:ci-not-a-real-secret@localhost:5432/careerlens_test
      TEST_DATABASE_URL: postgresql+psycopg://careerlens:ci-not-a-real-secret@localhost:5432/careerlens_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
