# CareerLens — reverse proxy and static frontend server.
#
# The frontend is a static Vite build; there is no Node runtime in
# production. Nginx is the single public entry point, so the API and
# worker are never exposed directly.

server {
    listen 80;
    server_name _;

    # Do not advertise the server version.
    server_tokens off;

    # The job-posting data this system handles is untrusted external
    # content; these headers limit what a rendered page can do with it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Built assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stage 3 and extraction calls can be slow; matching runs are
        # asynchronous, but synchronous reads should still not hang
        # forever.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
